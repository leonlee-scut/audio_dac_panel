# A solution is a collection of related projects that share same base configuration.
solution:
  created-for: CMSIS-Toolbox@2.12.0
  cdefault:

  # List of tested compilers that can be selected
  select-compiler:
    - compiler: AC6
    - compiler: GCC
    - compiler: IAR

  # Miscellaneous toolchain controls directly passed to the tools
  misc:
    - for-compiler: AC6 # change to -gdwarf-4 for debugging using uVision
      C-CPP:
        - -gdwarf-5
      ASM:
        - -gdwarf-5
        - -Wno-unused-command-line-argument

  # List the packs that define the device and/or board.
  packs:
    - pack: Keil::STM32F4xx_DFP
    - pack: ARM::CMSIS
    - pack: ARM::CMSIS-Driver_STM32
    - pack: Keil::STM32F4xx_DFP@3.1.1

  # List different hardware targets that are used to deploy the solution.
  target-types:
    - type: STM32F411CEUx
      device: STM32F411CEUx
      define:
        - STM32F411CEUx
      target-set:
        - set:
          images:
            - project-context: fw.Debug
          debugger:
            name: J-Link Server
            clock: 15000000
            protocol: swd
  build-types:
    - type: Debug
      debug: on
      optimize: none
      define:
        - DEBUG
        - _DEBUG

    - type: Release
      debug: off
      optimize: balanced
      define:
        - NDEBUG
        - RELEASE

  # List related projects.
  projects:
    - project: ./FW/fw.cproject.yml
  compiler: AC6
